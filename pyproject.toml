[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "proofline"
version = "0.1.0"
description = "Evidence-first financial claim analysis prototype"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "openpyxl==3.1.5",
  "mcp==1.29.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pypdf==6.0.0",
  "python-multipart==0.0.20",
  "reportlab==4.4.3",
  "pymupdf==1.26.4",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pypdf==6.0.0",
  "pytest==8.4.1",
  "ruff==0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proofline"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
