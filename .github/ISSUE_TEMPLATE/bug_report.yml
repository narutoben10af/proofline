name: Bug report
description: Report reproducible incorrect or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include confidential financial data, personal data, credentials, or security vulnerabilities. Follow SECURITY.md for private security reports.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a public or synthetic minimal example.
      placeholder: |
        1. Use input...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and provenance impact
      description: If relevant, explain whether source references, values, rationale, or classification were incorrect.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, branch, or release, if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant operating system, runtime, browser, and dependency details.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have removed secrets and confidential or personal information.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
